services:
  - type: web
    name: mt-bank-dashboard-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mt-bank-dashboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: none

databases:
  - name: mt-bank-dashboard-db
    databaseName: mt_dashboard
    user: mt_dashboard_user
    plan: free
